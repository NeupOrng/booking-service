services:
  postgres:
    image: postgres:16
    container_name: booking-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: booking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: booking-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: booking-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== ORY KRATOS ====================

  kratos-migrate:
    image: oryd/kratos:v1.3.1
    container_name: booking-kratos-migrate
    environment:
      - DSN=postgres://postgres:postgres@postgres:5432/kratos?sslmode=disable
    command: migrate -c /etc/config/kratos/kratos.yml sql -e --yes
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config/kratos:/etc/config/kratos

  kratos:
    image: oryd/kratos:v1.3.1
    container_name: booking-kratos
    ports:
      - "4433:4433"   # Public API (for frontend + your backend)
      - "4434:4434"   # Admin API (for your backend only - keep protected)
    environment:
      - DSN=postgres://postgres:postgres@postgres:5432/kratos?sslmode=disable
      - LOG_LEVEL=info
    command: serve -c /etc/config/kratos/kratos.yml --dev
    restart: unless-stopped
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    volumes:
      - ./config/kratos:/etc/config/kratos

  # ==================== ORY HYDRA ====================

  hydra-migrate:
    image: oryd/hydra:v2.2.0
    container_name: booking-hydra-migrate
    environment:
      - DSN=postgres://postgres:postgres@postgres:5432/hydra?sslmode=disable
    command: migrate sql --yes postgres://postgres:postgres@postgres:5432/hydra?sslmode=disable
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy

  hydra:
    image: oryd/hydra:v2.2.0
    container_name: booking-hydra
    ports:
      - "4444:4444"   # Public API (token, auth endpoints)
      - "4445:4445"   # Admin API (manage clients, challenges)
    environment:
      - DSN=postgres://postgres:postgres@postgres:5432/hydra?sslmode=disable
      - SECRETS_SYSTEM=${HYDRA_SECRETS_SYSTEM:-youReallyNeedToChangeThisSecret1234}
      - URLS_SELF_ISSUER=http://localhost:4444/
      - URLS_LOGIN=http://localhost:3001/oauth/login
      - URLS_CONSENT=http://localhost:3001/oauth/consent
      - URLS_LOGOUT=http://localhost:3001/oauth/logout
      - SERVE_PUBLIC_CORS_ENABLED=true
      - SERVE_PUBLIC_CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
      - LOG_LEVEL=info
    command: serve all --dev
    restart: unless-stopped
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  minio_data: