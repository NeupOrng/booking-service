services:
  postgres:
    image: postgres:16
    container_name: booking-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: booking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: booking-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: booking-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== ORY KRATOS ====================

  kratos-migrate:
    image: oryd/kratos:v1.3.1
    container_name: booking-kratos-migrate
    environment:
      - DSN=postgres://postgres:postgres@postgres:5432/kratos?sslmode=disable
    command: migrate -c /etc/config/kratos/kratos.yml sql -e --yes
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config/kratos:/etc/config/kratos

  kratos:
    image: oryd/kratos:v1.3.1
    container_name: booking-kratos
    ports:
      - "4433:4433"   # Public API (for frontend + your backend)
      - "4434:4434"   # Admin API (for your backend only - keep protected)
    environment:
      - DSN=postgres://postgres:postgres@postgres:5432/kratos?sslmode=disable
      - LOG_LEVEL=info
    command: serve -c /etc/config/kratos/kratos.yml --dev
    restart: unless-stopped
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    volumes:
      - ./config/kratos:/etc/config/kratos

volumes:
  postgres_data:
  redis_data:
  minio_data: