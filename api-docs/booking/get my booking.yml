info:
  name: get my booking
  type: http
  seq: 1

http:
  method: GET
  url: "{{base-api-url}}/bookings/my?status=upcoming"
  params:
    - name: status
      value: upcoming
      type: query
  auth:
    type: bearer
    token: "{{customer-access-token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
