info:
  name: Init Stag
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:4444/oauth2/auth?client_id=my-app&redirect_uri=http://myapp.com/callback&response_type=code&scope=openid profile email&state=random-state
  params:
    - name: client_id
      value: my-app
      type: query
    - name: redirect_uri
      value: http://myapp.com/callback
      type: query
    - name: response_type
      value: code
      type: query
    - name: scope
      value: openid profile email
      type: query
    - name: state
      value: random-state
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
