info:
  name: Step 5a - trigger redirecturl get Consent Challenge
  type: http
  seq: 7

http:
  method: GET
  url: "{{REDIRECT_TO_URL}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        let url = req.getUrl();

        if(url === "{{REDIRECT_TO_URL}}") {
          url = bru.getEnvVar("REDIRECT_TO_URL")
        }

        console.log('url', url);

        // Extract query string
        const [baseUrl, queryString] = url.split("?");
        const params = {};

        // Parse all params
        (queryString || "").split("&").forEach(pair => {
          const [key, value] = pair.split("=");
          params[decodeURIComponent(key)] = value || "";
        });

        // Decode redirect_uri if it exists
        if (params["redirect_uri"]) {
          params["redirect_uri"] = decodeURIComponent(params["redirect_uri"]);
          console.log("decoded redirect_uri", decodeURIComponent(params["redirect_uri"]));
        }

        // Rebuild query string
        const newQueryString = Object.entries(params)
          .map(([key, value]) => `${encodeURIComponent(key)}=${value}`)
          .join("&");

        // Rebuild full URL
        const newUrl = `${baseUrl}?${newQueryString}`;
        console.log('new url', newUrl);

        // Set the updated URL back to the request
        req.setUrl(newUrl);
    - type: after-response
      code: |-
        const location = res.getHeader('location');
        console.log('location', location);

        if (location) {
          const match = location.match(/[?&]consent_challenge=([^&]+)/);
          const challenge = match ? match[1] : null;
          if (challenge) {
            bru.setVar('CONSENT_CHALLENGE', challenge);
            bru.setEnvVar('CONSENT_CHALLENGE', challenge);
            console.log('✓ consent_challenge captured:', challenge);
          } else {
            console.log('✗ consent_challenge not found in location header');
          }
        } else {
          console.log('✗ No location header — ensure Max Redirects is set to 0');
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 0
