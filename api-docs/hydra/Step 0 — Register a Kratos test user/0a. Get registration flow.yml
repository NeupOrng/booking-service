info:
  name: 0a. Get registration flow
  type: http
  seq: 1

http:
  method: GET
  url: "{{base-api-url}}/auth/kratos/registration/flow"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();

        bru.setEnvVar("FLOW_ID", response.id)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
