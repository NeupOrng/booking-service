info:
  name: Get Register Flow
  type: http
  seq: 3

http:
  method: GET
  url: "{{base-api-url}}/auth/kratos/registration/flow"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();

        bru.setEnvVar("kratos-register-flow-id", response.id)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
