info:
  name: Get Login Flow By Id
  type: http
  seq: 5

http:
  method: GET
  url: "{{base-api-url}}/auth/kratos/login/flow"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();

        bru.setEnvVar("kratos-login-flow-id", response.id)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
