info:
  name: Get whoami
  type: http
  seq: 6

http:
  method: GET
  url: "{{base-api-url}}/auth/kratos/sessions/whoami"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();

        bru.setEnvVar("kratos-login-flow-id", response.id)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
